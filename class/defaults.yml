parameters:
  rollout_operator:
    =_metadata:
      multi_tenant: true

    namespace: syn-rollout-operator

    charts:
      rollout-operator:
        source: https://grafana.github.io/helm-charts
        version: v0.47.0

    images:
      rolloutOperator:
        registry: docker.io
        repository: grafana/rollout-operator

    resources:
      requests:
        cpu: 100m
        memory: 100Mi
      limits:
        memory: 200Mi

    webhooks:
      # Note that the webhooks installs rollout-operator CRDs.
      enabled: true
      timeoutSeconds: 10
      failurePolicy: 'Fail'
      selfSignedCertSecretName: 'certificate'
      objectSelector: {}
      namespaceSelector:
        matchLabels:
          rollout-operator.syn.tools/allow: ''
        # matchExpressions:
        #   - key: rollout-operator.syn.tools/allow
        #     operator: Exists

    monitoring: true
    alerts:
      rules:
        'alert:SYN_IncorrectWebhookConfigurationFailurePolicy':
          expr: 'count by(type, webhook, namespace) (kube_validating_webhook_failure_policy{policy="Ignore", webhook=~"^(pod-eviction|zpdb-validation).+"} > 0)'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'A validating or mutating rollout-operator webhook has an Ignore policy set. This should be set to Fail.'
        'alert:SYN_BadZoneAwarePodDisruptionBudgetConfiguration':
          expr: 'sum by (job, namespace)(rate(rollout_operator_zpdb_configurations_observed_total{result="invalid"}[5m])) > 0'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'An invalid zone aware pod disruption budget configuration has been observed.'
        'alert:SYN_HighNumberInflightZpdbRequests':
          expr: 'avg_over_time(rollout_operator_zpdb_inflight_eviction_requests[5m]) > 10'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'A sustained number of inflight ZPDB eviction requests has been observed.'

    helmValues: {}
