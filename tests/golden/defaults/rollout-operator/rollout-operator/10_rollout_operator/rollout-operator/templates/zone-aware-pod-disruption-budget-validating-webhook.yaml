apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  labels:
    app.kubernetes.io/instance: rollout-operator
    app.kubernetes.io/managed-by: commodore
    app.kubernetes.io/name: rollout-operator
    app.kubernetes.io/version: v0.36.1
    grafana.com/inject-rollout-operator-ca: 'true'
    grafana.com/namespace: syn-rollout-operator
    helm.sh/chart: rollout-operator-0.47.0
  name: zpdb-validation-syn-rollout-operator
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: rollout-operator
        namespace: syn-rollout-operator
        path: /admission/zpdb-validation
        port: 443
    failurePolicy: Fail
    name: zpdb-validation-syn-rollout-operator.grafana.com
    namespaceSelector:
      matchLabels:
        rollout-operator.syn.tools/allow: ''
    rules:
      - apiGroups:
          - rollout-operator.grafana.com
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - zoneawarepoddisruptionbudgets
        scope: Namespaced
    sideEffects: None
    timeoutSeconds: 10
