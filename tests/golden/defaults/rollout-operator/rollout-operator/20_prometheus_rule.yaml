apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/managed-by: commodore
    app.kubernetes.io/name: rollout-operator
    name: rollout-operator
  name: rollout-operator
  namespace: syn-rollout-operator
spec:
  groups:
    - name: rollout-operator.rules
      rules:
        - alert: SYN_BadZoneAwarePodDisruptionBudgetConfiguration
          annotations:
            summary: An invalid zone aware pod disruption budget configuration has
              been observed.
          expr: sum by (job, namespace)(rate(rollout_operator_zpdb_configurations_observed_total{result="invalid"}[5m]))
            > 0
          for: 5m
          labels:
            severity: warning
            syn: 'true'
            syn_component: rollout-operator
        - alert: SYN_HighNumberInflightZpdbRequests
          annotations:
            summary: A sustained number of inflight ZPDB eviction requests has been
              observed.
          expr: avg_over_time(rollout_operator_zpdb_inflight_eviction_requests[5m])
            > 10
          for: 5m
          labels:
            severity: warning
            syn: 'true'
            syn_component: rollout-operator
        - alert: SYN_IncorrectWebhookConfigurationFailurePolicy
          annotations:
            summary: A validating or mutating rollout-operator webhook has an Ignore
              policy set. This should be set to Fail.
          expr: count by(type, webhook, namespace) (kube_validating_webhook_failure_policy{policy="Ignore",
            webhook=~"^(pod-eviction|zpdb-validation).+"} > 0)
          for: 5m
          labels:
            severity: warning
            syn: 'true'
            syn_component: rollout-operator
