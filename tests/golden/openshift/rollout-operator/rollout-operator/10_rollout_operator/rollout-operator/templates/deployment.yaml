apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: rollout-operator
    app.kubernetes.io/managed-by: commodore
    app.kubernetes.io/name: rollout-operator
    app.kubernetes.io/version: v0.36.1
    helm.sh/chart: rollout-operator-0.47.0
  name: rollout-operator
  namespace: syn-rollout-operator
spec:
  minReadySeconds: 10
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: rollout-operator
      app.kubernetes.io/name: rollout-operator
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: rollout-operator
        app.kubernetes.io/name: rollout-operator
      namespace: syn-rollout-operator
    spec:
      containers:
        - args:
            - -kubernetes.namespace=syn-rollout-operator
          image: docker.io/grafana/rollout-operator:v0.36.1
          imagePullPolicy: IfNotPresent
          name: rollout-operator
          ports:
            - containerPort: 8001
              name: http-metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 5
            timeoutSeconds: 1
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext: {}
      serviceAccountName: rollout-operator
